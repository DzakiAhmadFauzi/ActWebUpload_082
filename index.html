<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Unggah File Baru</h2>
        <nav>
            <a href="index.html" class="active">Upload</a> | 
            <a href="list-file.php">Lihat Daftar File</a>
        </nav>
        
        <form action="upload.php" method="POST" enctype="multipart/form-data" class="upload-form">
            <div class="file-drop-area">
                <input type="file" name="fileToUpload" id="fileToUpload" accept="image/*" required>
                <p>Klik atau seret file gambar ke sini</p>
            </div>
            
            <!-- Tempat Preview Gambar -->
            <div id="preview-container" class="hidden">
                <img id="image-preview" src="#" alt="Preview Gambar">
            </div>

            <button type="submit" name="submit" class="btn-submit">Mulai Unggah</button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileToUpload');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.setAttribute('src', e.target.result);
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
